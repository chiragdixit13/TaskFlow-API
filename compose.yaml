services:
  api:
    build: .
    container_name: taskflow_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/taskflow_db"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: taskflow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: taskflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: